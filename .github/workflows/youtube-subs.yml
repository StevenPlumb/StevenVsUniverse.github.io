
name: Update YouTube Subscribers

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-subscribers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get YouTube subscriber count
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          api_key = os.environ["YOUTUBE_API_KEY"]

          params = urllib.parse.urlencode({
              "part": "statistics,snippet",
              "forHandle": "StevenVsGames",
              "key": api_key
          })

          url = (
              "https://www.googleapis.com/youtube/v3/channels?"
              + params
          )

          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.load(response)

          if not data.get("items"):
              raise RuntimeError(
                  "StevenVsGames YouTube channel not found"
              )

          channel = data["items"][0]
          stats = channel["statistics"]

          if stats.get("hiddenSubscriberCount", False):
              raise RuntimeError(
                  "Subscriber count is hidden"
              )

          count = int(stats["subscriberCount"])

          result = {
              "channel": channel["snippet"]["title"],
              "subscribers": count,
              "updated": datetime.now(
                  timezone.utc
              ).isoformat()
          }

          with open(
              "subscriber-count.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(result, file, indent=2)

          print("Subscriber data updated successfully")
          PY

      - name: Commit updated count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add subscriber-count.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update YouTube subscriber count"
            git push
          fi
